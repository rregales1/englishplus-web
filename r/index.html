<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un repte d'English+</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f6f7fb; color: #16202a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #101418; color: #e6edf3; }
    .card { background: #182029 !important; }
  }
  .card {
    background: #fff; padding: 32px 28px; border-radius: 18px; max-width: 420px;
    margin: 20px; box-shadow: 0 6px 24px rgba(0,0,0,.08); text-align: center;
  }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  p  { margin: 0 0 18px; opacity: .85; }
  a.btn {
    display: block; padding: 14px 20px; border-radius: 12px; text-decoration: none;
    background: #0B4F6C; color: #fff; font-weight: 600;
  }
  small { display: block; margin-top: 16px; opacity: .6; }
  code { word-break: break-all; font-size: .75rem; opacity: .5; }
</style>
</head>
<body>
  <div class="card">
    <h1>🎯 Tens un repte</h1>
    <p>Obre'l amb English+ i a veure qui en sap més.</p>
    <a class="btn" id="obrir" href="#">Obrir a English+</a>
    <small>Si no tens l'app instal·lada, copia aquest missatge i enganxa'l a English+ quan la tinguis.</small>
    <small><code id="codi"></code></small>
  </div>

<script>
  // El codi del repte viatja al paràmetre "c" i es passa tal qual a l'app.
  //
  // No es fa cap salt automàtic a propòsit: els navegadors bloquegen els salts a
  // esquemes propis que no ha demanat la persona, i el que es veuria seria un error.
  // Amb un botó, el clic és seu i sempre funciona.
  var c = new URLSearchParams(location.search).get('c') || '';
  document.getElementById('obrir').href = 'englishplus://reto?c=' + encodeURIComponent(c);
  document.getElementById('codi').textContent = c;
</script>
</body>
</html>
